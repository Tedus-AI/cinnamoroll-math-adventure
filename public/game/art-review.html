<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>素材逐件檢查</title><link rel="stylesheet" href="./character.css"><link rel="stylesheet" href="./customization.css"><style>body{background:#edf4fb;color:#3e5878;font:14px system-ui;margin:20px}#grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}article{background:white;border:1px solid #ccdced;border-radius:12px;text-align:center;padding:8px}article>.item-art{width:100%;height:140px}h3{font-size:13px;margin:5px}.characters{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.characters .character-live{height:auto}button{padding:10px}</style><h1>逐件素材與穿戴檢查</h1><button id="pose">切換下一個原版姿勢</button><h2>新帽子、衣服（每種原版姿勢）</h2><div class="characters" id="fits"></div><h2>五款異色</h2><div class="characters" id="skins"></div><h2>全部配件與擺飾</h2><div id="grid"></div><script type="module">
import {COLLECTION} from './engine.js';import {itemArt} from './item-art.js';import {animatedCharacter,mountCharacters} from './character.js';import {SKINS} from './progression.js';
let pose=0;const sets=[{head:'hat-starlight',outfit:'outfit-cape'},{head:'hat-bonnet',outfit:'outfit-apron'},{head:'hat-nightcap',outfit:'outfit-sailor'},{head:'beret',outfit:'outfit-apron'},{head:'straw-hat',outfit:'outfit-sailor'},{head:'hat',outfit:'outfit-cape'}];
function render(){document.querySelector('#fits').innerHTML=sets.map((slots,i)=>'<article>'+animatedCharacter(slots,pose)+'<h3>穿搭 '+(i+1)+' · 姿勢 '+pose+'</h3></article>').join('');document.querySelector('#skins').innerHTML=SKINS.map(s=>'<article>'+animatedCharacter({},0,s.id)+'<h3>'+s.name+'</h3></article>').join('');mountCharacters();}
document.querySelector('#pose').onclick=()=>{pose=(pose+1)%6;render();};document.querySelector('#grid').innerHTML=COLLECTION.filter(i=>['accessory','prop'].includes(i.kind)).map(i=>'<article>'+itemArt(i.id)+'<h3>'+i.name+'</h3></article>').join('');render();
</script></html>
